name: Keep Streamlit awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit app
        run: |
          curl --fail --location --silent --show-error --max-time 60 \
            "https://lake-cerknica-digital-twin.streamlit.app/"
