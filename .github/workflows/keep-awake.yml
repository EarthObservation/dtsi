name: Keep Streamlit apps awake

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Check both Streamlit apps
        shell: bash
        run: |
          set -e

          for url in \
            "https://dtsi-lake-cerknica.streamlit.app/_stcore/health" \
            "https://lake-cerknica-digital-twin.streamlit.app/_stcore/health"
          do
            echo "Checking $url"

            curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 20 \
              --max-time 60 \
              "$url"

            echo
          done
