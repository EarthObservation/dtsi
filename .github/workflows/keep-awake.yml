name: Keep Streamlit apps awake

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Wake Streamlit apps
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          const urls = [
            'https://dtsi-lake-cerknica.streamlit.app/',
            'https://lake-cerknica-digital-twin.streamlit.app/'
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });

            for (const url of urls) {
              console.log(`Opening ${url}`);

              const page = await browser.newPage();

              try {
                await page.goto(url, {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                });

                await page.waitForTimeout(3000);

                const wakeButton = page.getByRole('button', {
                  name: /get this app back up/i
                });

                if (await wakeButton.count()) {
                  console.log('App is sleeping. Clicking wake button...');
                  await wakeButton.first().click();

                  await page.waitForTimeout(15000);

                  console.log('Wake request sent.');
                } else {
                  console.log('App appears to already be awake.');
                }

              } catch (error) {
                console.error(`Problem with ${url}:`, error.message);
              } finally {
                await page.close();
              }
            }

            await browser.close();
          })();
          EOF
